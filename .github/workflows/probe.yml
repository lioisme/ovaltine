name: probe-env

# 一次性旁路自检：确认 runner 侧「写 Release 正文」这条观察通道到底通不通。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p:
    name: 观察通道自检
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { path: ci }
      - name: 检查脚本与 token 可见性
        run: |
          ls -l ci/infra/progress.sh
          env | grep -oE '^(GH[A-Z_]*|GITHUB_[A-Z_]*)' | sort -u
          echo "GH_REPO=${GH_REPO:-<未设>} GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-<未设>}"
      - name: 试写 Release 正文
        run: |
          bash ci/infra/progress.sh "runner 自检 $(date -u +%H:%M:%SZ)"
          GH_TOKEN=$GITHUB_TOKEN gh api repos/$GITHUB_REPOSITORY/releases/tags/ci-handoff \
            --jq '"body=\(.body)  updated=\(.updated_at)"'
