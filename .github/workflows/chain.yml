name: chain-rom

# build-rom 每轮结束后来这里报到：读 Release 里的 state.json，
# 没出包且没超轮数就再排一轮 build-rom。出包、到上限、或连续失败就停下等人工看。

on:
  workflow_run:
    workflows: [build-rom]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: chain-rom
  cancel-in-progress: false

env:
  HANDOFF_TAG: ci-handoff
  MAX_CYCLES: "10"

jobs:
  next:
    name: 排下一轮
    runs-on: ubuntu-24.04
    if: contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    steps:
      - name: 读状态并决定是否接力
        id: st
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f() { sed -n "s/.*\"$1\": *\"\{0,1\}\([^\",}]*\)\"\{0,1\}.*/\1/p" state.json | head -1; }
          go() { echo "go=true" >> "$GITHUB_OUTPUT"
                 echo "nxt_branch=${1:-lineage-23.2}" >> "$GITHUB_OUTPUT"
                 echo "nxt_variant=${2:-userdebug}" >> "$GITHUB_OUTPUT"
                 echo "nxt_targets=${3:-dist}" >> "$GITHUB_OUTPUT"; }

          # 连续两轮跑不完（同步/取回失败）就是结构性问题，别再往下烧机时
          # 只看「从最近一次往前的连续失败数」，否则我手工取消的旧轮会永久污染这个计数
          bad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=15" \
                 --jq '[.workflow_runs[] | select(.status=="completed") | .conclusion] | join(",")' |
                awk -F, '{c=0; for(i=1;i<=NF;i++){ if($i=="failure"||$i=="cancelled") c++; else break } print c}')
          if [ "${bad:-9}" -ge 2 ]; then echo "近 3 轮里有 ${bad} 轮失败/取消，停止接力等人工"; exit 0; fi

          if ! gh release download "$HANDOFF_TAG" -p state.json -D . --clobber; then
            echo "无 state.json（上一轮没跑到记账）：重开一轮全量"; go
            exit 0
          fi
          cat state.json
          done_v="$(f done)"; cyc="$(f cycle)"; branch="$(f branch)"; variant="$(f variant)"
          echo "cycle=$cyc done=$done_v branch=$branch variant=$variant"
          if [ "$done_v" = "true" ]; then
            echo "已出包，接力完成"
          elif [ -z "${cyc:-}" ] || [ "$cyc" = "0" ]; then
            echo "状态里没有轮次，停止接力"
          elif [ "$cyc" -ge "$MAX_CYCLES" ]; then
            echo "已到轮数上限 $MAX_CYCLES，停下等人工判断"
          else
            go "$branch" "$variant" "$(f targets)"
          fi

      - name: 触发下一轮 build-rom
        if: steps.st.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref "$GITHUB_REF_NAME" \
            -f branch="${{ steps.st.outputs.nxt_branch }}" \
            -f variant="${{ steps.st.outputs.nxt_variant }}" \n            -f targets="${{ steps.st.outputs.nxt_targets }}"
          echo "已排队下一轮（${{ steps.st.outputs.nxt_branch }} / ${{ steps.st.outputs.nxt_variant }}）"
