name: build-rom

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "LineageOS 平台分支"
        type: choice
        default: lineage-23.2
        options: [lineage-21.0, lineage-22.2, lineage-23.2]
      runner:
        description: Runner 规格
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, self-hosted]
      variant:
        description: "构建类型"
        type: choice
        default: userdebug
        options: [userdebug, eng]
      repopick:
        description: "额外 gerrit topic（留空则不挑）"
        default: ""
      use_cn_patches:
        description: "应用 patches/ 下的 PGP110 补丁（需先自提国行 blob）"
        type: boolean
        default: false
      prune_repo:
        description: "同步后强制清理 .repo 对象库（省磁盘）"
        type: boolean
        default: false

env:
  DEVICE: ovaltine

jobs:
  rom:
    name: ${{ inputs.branch }} / ${{ inputs.variant }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 540
    steps:
      - name: 取用本仓配置（manifest + 构建脚本）
        uses: actions/checkout@v4
        with: { path: ci }

      - name: 装依赖并腾空磁盘
        run: |
          # root 或有 sudo 时才提权；self-hosted runner 可能已是 root 或已预装依赖
          SUDO=; if [ "$(id -u)" != 0 ]; then command -v sudo >/dev/null && SUDO=sudo; fi
          $SUDO rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          $SUDO apt-get update -y || echo "apt update 失败（可能非 Ubuntu runner）"
          # 逐包安装：个别包名在新版镜像里不存在时不整体失败
          for p in git git-lfs curl wget unzip zip bison flex build-essential g++ gawk bzip2 \
                   lz4 zstd swig ccache rsync file xmlstarlet libxml2-utils device-tree-compiler \
                   python3 python3-pip python3-mako python3-protobuf python3-setuptools \
                   python3-yaml python3-lxml openjdk-17-jdk-headless srecord schedtool \
                   libgl1-mesa-dev x11proto-core-dev; do
            $SUDO apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 || echo "跳过不存在的包: $p"
          done
          $SUDO curl -sL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          $SUDO chmod a+x /usr/local/bin/repo
          nproc; free -g | head -2; df -h /

      - name: 生成 local_manifest
        run: |
          set -e
          PLAT="${{ inputs.branch }}"
          COMMUNITY="$(printf '%s' "$PLAT" | sed 's/\.0$//')"
          mkdir -p .repo/local_manifests
          sed -e "s#@PLATFORM@#$PLAT#g" -e "s#@COMMUNITY@#$COMMUNITY#g" \
              ci/local_manifests/ovaltine.xml > .repo/local_manifests/ovaltine.xml
          grep -E "remote name=|revision=" .repo/local_manifests/ovaltine.xml

      - name: repo init
        run: |
          git config --global user.email ci@invalid && git config --global user.name ci
          # --partial-clone：blob 按需拉取，显著降低 .repo 峰值占用
          repo init -u https://github.com/LineageOS/android -b "${{ inputs.branch }}" \
               --depth=1 --git-lfs --partial-clone
          df -h /

      - name: repo sync（带磁盘观测，失败自动重试）
        timeout-minutes: 200
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"        # 先不落 LFS 内容，稍后只对 blob 树拉
        run: |
          ( while :; do sleep 180; printf 'OBS %s  .repo=%s  avail=%sG\n' "$(date -u +%H:%M:%S)" \
              "$(du -sh .repo 2>/dev/null | cut -f1)" "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)"; done ) &
          MON=$!
          for i in 1 2 3 4 5; do
            echo "=== sync 第 $i 次 ==="
            if repo sync -c --no-tags -j16 --force-sync; then OK=1; break; fi
            echo "第 $i 次失败；当前磁盘："; df -h /; du -sh .repo 2>/dev/null
            [ "$i" = 5 ] && { kill $MON 2>/dev/null; exit 1; }
            sleep 25
          done
          kill $MON 2>/dev/null
          [ "${OK:-0}" = 1 ]
          # 只对承载固件镜像的 blob 树取 LFS 内容（约 360MB）
          for t in vendor/oneplus/ovaltine vendor/oneplus/sm8450-common; do
            [ -d "$t" ] && git -C "$t" lfs pull 2>/dev/null || true
          done
          du -sh .repo; df -h /

      - name: 空间不足时回收 .repo 对象库
        run: |
          AVAIL=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "根盘可用 ${AVAIL}G（LineageOS 浅同步约 60-80G，out/ 还要 40-60G）"
          if [ "${{ inputs.prune_repo }}" = "true" ] || [ "$AVAIL" -lt 70 ]; then
            echo "== 删除 .repo 里的 git 对象库（编译阶段不再需要 git 历史）"
            du -sh .repo || true
            find .repo -maxdepth 3 -type d -name 'project-objects' -prune -exec rm -rf {} + 2>/dev/null || true
            find . -mindepth 2 -type d -name '.git' -prune -exec rm -rf {} + 2>/dev/null || true
            du -sh .repo || true; df -h /
          fi

      - name: 应用本地补丁（文件名用下划线代替路径分隔，如 device_oneplus_ovaltine.patch）
        if: ${{ inputs.use_cn_patches }}
        run: |
          shopt -s nullglob
          for f in ci/patches/*.patch; do
            p="$(basename "$f" .patch | tr '_' '/')"
            echo "== git -C $p apply $(basename "$f")"
            git -C "$p" apply -p1 --whitespace=nowarn "$GITHUB_WORKSPACE/$f"
            git -C "$p" diff --stat
          done

      - name: 挑 gerrit 补丁（可选）
        if: ${{ inputs.repopick != '' }}
        run: repopick -t "${{ inputs.repopick }}"

      - name: 编译
        run: |
          ccache -M 25G 2>/dev/null || true; ccache -z 2>/dev/null || true
          bash ci/build.sh "${{ inputs.variant }}"
          ccache -s 2>/dev/null | head -8
          df -h /

      - name: 收集产物
        run: |
          set -e
          mkdir -p artifacts
          find "out/target/product/$DEVICE" -maxdepth 1 \( -name '*.zip' -o -name '*.img' \) \
               -exec cp -v {} artifacts/ \;
          (cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          test -n "$(ls -A artifacts)"

      - name: 上传 ROM
        uses: actions/upload-artifact@v4
        with:
          name: ovaltine-${{ inputs.branch }}-${{ inputs.variant }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
