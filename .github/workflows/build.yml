name: build-rom

# 一次 hosted job（≤6h、磁盘 ~108G）装不下一整轮 LineageOS 构建，
# 所以这个 workflow 是「一轮」：能续建就续建，干不完就把 tree/out 存进 Release，
# 由 chain.yml 在 job 结束后自动再排一轮，直到 out/dist 里出现可刷 zip。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "LineageOS 平台分支"
        type: choice
        default: lineage-23.2
        options: [lineage-21.0, lineage-22.2, lineage-23.2]
      variant:
        description: "构建类型"
        type: choice
        default: userdebug
        options: [userdebug, eng]
      use_cn_patches:
        description: "应用 patches/ 下的 PGP110 补丁（国行身份 + 自提指纹 HAL）"
        type: boolean
        default: false
      reset:
        description: "忽略续建存档，强制全量重新同步"
        type: boolean
        default: false
      targets:
        description: "构建目标（dist=可刷 zip + target_files；droid=只出分区镜像，省 10-20G 磁盘）"
        type: choice
        default: dist
        options: [dist, droid]

permissions:
  contents: write

concurrency:
  group: build-rom
  cancel-in-progress: false

env:
  DEVICE: ovaltine
  HANDOFF_TAG: ci-handoff
  RESERVE_MIN: "60"        # 留给 tree/out 打包上传的时间

jobs:
  rom:
    name: ${{ inputs.branch }} / ${{ inputs.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # 实测：这个仓库的 step 环境里没有自动注入的 GITHUB_TOKEN（gh 直接报
      # "To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN"），
      # 少这一行则 Release 建不出来、tree/out 存不了、活体进度也写不进去。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 取用本仓配置（infra + build.sh + manifest 模板）
        uses: actions/checkout@v4
        with: { path: ci }

      - name: 装依赖并腾空磁盘
        run: |
          SUDO=; if [ "$(id -u)" != 0 ]; then command -v sudo >/dev/null && SUDO=sudo; fi
          $SUDO rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          $SUDO apt-get update -y || echo "apt update 失败（可能非 Ubuntu runner）"
          # 逐包安装：个别包名在新版镜像里不存在时不整体失败
          for p in git git-lfs curl wget unzip zip bison flex build-essential g++ gawk bzip2 \
                   lz4 zstd swig rsync file xmlstarlet device-tree-compiler \
                   python3 python3-pip python3-mako python3-protobuf python3-setuptools \
                   python3-yaml python3-lxml openjdk-17-jdk-headless srecord schedtool \
                   libgl1-mesa-dev x11proto-core-dev \
                   bc libssl-dev libelf-dev dwarves m4 elfutils libxml2-utils uuid-dev cpio kmod xz-utils; do
            $SUDO apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 || echo "跳过不存在的包: $p"
          done
          $SUDO curl -sL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          $SUDO chmod a+x /usr/local/bin/repo
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          nproc; free -g | head -2; df -h / | tail -1

      - name: 探测续建存档
        id: probe
        continue-on-error: true
        run: |
          if [ "${{ inputs.reset }}" = "true" ]; then echo "显式 reset，走全量同步"; exit 1; fi
          bash ci/infra/handoff.sh probe

      - name: 定轮次（读 Release 里的 state.json）
        run: bash ci/infra/cycle.sh

      - name: 全量同步（单发优先，爆盘则分批）
        id: sync
        if: steps.probe.outcome != 'success'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -e
          PLAT="${{ inputs.branch }}"
          COMMUNITY="$(printf '%s' "$PLAT" | sed 's/\.0$//')"
          mkdir -p .repo/local_manifests
          sed -e "s#@PLATFORM@#$PLAT#g" -e "s#@COMMUNITY@#$COMMUNITY#g" \
              ci/local_manifests/ovaltine.xml > .repo/local_manifests/ovaltine.xml
          # 磁盘裁剪：CTS/预编译内核/模拟器/cuttlefish 等与本机型无关的几十 G 直接不同步
          cp ci/local_manifests/cull.xml .repo/local_manifests/cull.xml
          grep -E "remote name=|revision=" .repo/local_manifests/ovaltine.xml
          grep -c remove-project .repo/local_manifests/cull.xml
          git config --global user.email ci@invalid && git config --global user.name ci
          repo init -u https://github.com/LineageOS/android -b "$PLAT" --depth=1 --git-lfs
          # 同步最多占到「总预算 - 收尾 - 编译保底 90 分钟」
          now=$(date +%s)
          hard=$(( (350 - RESERVE_MIN - 90) * 60 - (now - JOB_START) ))
          export SYNC_HARD_SECS=$hard
          echo "== 同步硬预算 ${hard}s"
          t0=$(date +%s)
          bash ci/infra/sync.sh
          echo "SYNC_SECS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: 取回上一轮的 tree + out
        id: get
        if: steps.probe.outcome == 'success'
        run: |
          set -e
          t0=$(date +%s)
          bash ci/infra/handoff.sh get
          # 存档可能被别的进程动过（被取消的轮的僵尸进程还在传同名分片）→ 体检不过就增量修复
          if ! bash ci/infra/verify-tree.sh; then
            echo "== 体检不过，走同步修复（只补差异）"
            now=$(date +%s)
            export SYNC_HARD_SECS=$(( (350 - RESERVE_MIN - 90) * 60 - (now - JOB_START) ))
            bash ci/infra/sync.sh
          fi
          echo "SYNC_SECS=resume:$(( $(date +%s) - t0 ))s" >> "$GITHUB_ENV"

      - name: 应用本地补丁（文件名用下划线代替路径分隔）
        if: ${{ inputs.use_cn_patches }}
        run: |
          set -e
          shopt -s nullglob
          for f in ci/patches/*.patch; do
            p="$(basename "$f" .patch | tr '_' '/')"
            echo "== patch -p1 -d $p < $(basename "$f")"
            ( cd "$p" && patch -p1 --fuzz=0 -i "$GITHUB_WORKSPACE/$f" )
          done

      - name: 回收 git 元数据与非用 clang 版本（给 out/ 腾地方）
        run: bash ci/infra/prune.sh && bash ci/infra/slim.sh

      # 源码树一旦齐了就立刻存档：后面编译哪怕炸了，下一轮也不用再花几小时同步
      - name: 存档源码树（仅同步成功轮）
        if: steps.sync.outcome == 'success'
        env:
          BRANCH: ${{ inputs.branch }}
          VARIANT: ${{ inputs.variant }}
          TARGETS: ${{ inputs.targets }}
          NOTE: tree@sync
        run: bash ci/infra/handoff.sh save-tree

      - name: 编译（按剩余预算限时，到点优雅收尾）
        id: build
        env:
          BUILD_TARGETS: ${{ inputs.targets == 'droid' && '' || 'dist' }}
        run: |
          set +e
          now=$(date +%s)
          left=$(( (350 - RESERVE_MIN) * 60 - (now - JOB_START) ))
          [ "$left" -lt 900 ] && left=900          # 至少给 15 分钟，好让日志留下失败现场
          echo "== 本轮编译预算 ${left}s（约 $((left/60)) 分钟）"
          t0=$(date +%s)
          : > "$RUNNER_TEMP/build.log"
          # 跑中的 job 取不到部分日志，编译速率靠这条旁路透出（每 6 分钟一行）
          ( while :; do
              sleep 360
              p=$(grep -aoE '\[ *[0-9]+%[ ]*[0-9]+ / [0-9]+\]' "$RUNNER_TEMP/build.log" 2>/dev/null | tail -1)
              bash ci/infra/progress.sh "build ${p:-刚启动} avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')G"
            done ) & WD=$!
          timeout -s INT -k 120 "$left" bash ci/build.sh "${{ inputs.variant }}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          kill $WD 2>/dev/null
          echo "BUILD_SECS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          echo "build_rc=$rc"
          [ "$rc" = 124 ] && echo "== 到达预算，已优雅中断（进度会存进 Release 供下一轮接力）"
          echo "BUILD_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: 判定产物
        id: verdict
        run: |
          zip=$(find out -maxdepth 3 -type f -name 'lineage*.zip' 2>/dev/null | head -1)
          if [ -z "$zip" ] && [ "${{ inputs.targets }}" = droid ]; then
            # 只出镜像这条路：分区镜像齐了就算可刷产物（fastbootd 刷入）
            P=out/target/product/ovaltine
            imgs=""
            for i in super.img boot.img vendor_boot.img init_boot.img dtbo.img vbmeta.img \
                     vbmeta_system.img vbmeta_vendor.img recovery.img vendor_dlkm.img; do
              [ -f "$P/$i" ] && imgs="$imgs $i"
            done
            if echo "$imgs" | grep -q super.img && echo "$imgs" | grep -q boot.img; then
              mkdir -p artifacts
              ( cd "$P" && zip -q -r "$OLDPWD/artifacts/ovaltine-lineage-${{ inputs.branch }}-$(date -u +%Y%m%d)-images.zip" $imgs )
              zip=artifacts/$(basename "$(ls artifacts/*-images.zip | head -1)")
              echo "可刷镜像齐了：$imgs"
            fi
          fi
          if [ -n "$zip" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "DONE=true" >> "$GITHUB_ENV"
            echo "ROM=$zip" >> "$GITHUB_ENV"
            ls -lh $zip; sha256sum $zip | tee rom.sha256
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "DONE=false" >> "$GITHUB_ENV"
            echo "== 还没出包；本轮 out/ 进度将被保存"
            du -xsh out */ 2>/dev/null | sort -h | tail -10
            echo "== 编译日志尾部 =="; tail -40 "$RUNNER_TEMP/build.log" 2>/dev/null || true
          fi
          df -h / | tail -1

      - name: 存档 out/ 并写回状态
        if: always() && steps.get.outcome != 'failure'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BRANCH: ${{ inputs.branch }}
          VARIANT: ${{ inputs.variant }}
          TARGETS: ${{ inputs.targets }}
          NOTE: ${{ steps.verdict.outputs.done == 'true' && 'rom-ready' || 'partial' }}
        run: bash ci/infra/handoff.sh save-out

      - name: 收集并上传 ROM
        if: steps.verdict.outputs.done == 'true'
        run: |
          set -e
          mkdir -p artifacts
          find out -maxdepth 3 -type f \( -name 'lineage*.zip' -o -name '*target_files*.zip' \) -exec cp -v {} artifacts/ \;
          ( cd artifacts && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS )
          test -s artifacts/SHA256SUMS
      - name: 上传 ROM 产物
        if: steps.verdict.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ovaltine-${{ inputs.branch }}-${{ inputs.variant }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: 写本轮小结
        if: always()
        run: |
          {
            echo "## ovaltine 构建轮次小结"
            echo "- 分支/类型：${{ inputs.branch }} / ${{ inputs.variant }}"
            echo "- 起点：$([ "${{ steps.probe.outcome }}" = success ] && echo 续建（Release 取回） || echo 全量同步)"
            echo "- 同步耗时：${SYNC_SECS:-?}s  编译耗时：${BUILD_SECS:-?}s  编译退出码：${BUILD_RC:-?}"
            echo "- 是否出包：**${DONE:-false}** ${ROM:-}"
            echo "- 磁盘：$(df -h / | tail -1)"
            echo "- 状态存档：Release \`$HANDOFF_TAG\`（tree/out 分片）"
          } >> "$GITHUB_STEP_SUMMARY"
