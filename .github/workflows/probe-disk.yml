name: probe-disk

on: { workflow_dispatch: {} }

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: 容量与内存实测
        run: |
          set -x
          nproc; free -g
          echo "=== 所有挂载点 ==="
          df -hT | grep -vE "tmpfs|udev|overlay$"
          echo "=== /mnt 是否存在且更大 ==="
          sudo mkdir -p /mnt/probe && touch /mnt/probe/ok && ls -l /mnt/probe/ok
          df -h / /mnt /home "$RUNNER_TEMP" 2>/dev/null
          echo "=== 写速实测（2GB）==="
          sudo dd if=/dev/zero of=/mnt/speed.bin bs=1M count=2048 oflag=direct 2>&1 | tail -2 || \
            dd if=/dev/zero of=/mnt/speed.bin bs=1M count=2048 2>&1 | tail -2
          sudo rm -f /mnt/speed.bin
          echo "=== 根盘写速（对照）==="
          dd if=/dev/zero of=$RUNNER_TEMP/speed.bin bs=1M count=2048 2>&1 | tail -2
          rm -f $RUNNER_TEMP/speed.bin
